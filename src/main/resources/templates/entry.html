<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>スタートページ</title>
<style>
  /* 背景色をオレンジに */
  body {
    background-color:	#FFDAB9;
    margin: 0;
    height: 100vh; /* 画面高さいっぱい */
    display: flex;
    justify-content: center; /* 横方向中央寄せ */
    align-items: center;     /* 縦方向中央寄せ */
    font-family: Arial, sans-serif;
  }
  
  p{
  	     color: rgb(255, 128, 64);
  	     text-align: center;
  	     margin-bottom: 30px;
  	     font-weight: bold;
  	     font-size: 20px;
  	   }
  .container {
      text-align: center;
	  display: flex;
	  flex-direction: column;
	  align-items: center;
    }
  a {
    font-size: 1.5rem;      /* 文字サイズ大きく */
    color: white;           /* 見やすいオレンジに */
    text-decoration: none;  /* 下線を消す */
    font-weight: bold;
    padding: 15px 30px;
    border: 2px solid white;
    border-radius: 10px;
    transition: background-color 0.3s, color 0.3s;
	display: inline-block;
  }

  a:hover {
    background-color: white;
    color: orange;
  }
  img {
     margin-top: 30px;  /* リンクから少し間隔を空ける */
     max-width: 230px;
     height: auto;
   }
   
   form {
   	     background: rgb(255, 250, 234);
   	     padding: 30px 40px;
   	     border-radius: 20px;  	    
   	     width: 250px;
   	   }
	   
	   form label {
	      display: block;
	      text-align: left;
	      font-size: 16px;
	      font-weight: bold;
	      margin-bottom: 6px;
	      color: rgb(241, 130, 48); /* ラベルの文字色 */
	    }
	   
	   th {
	        text-align: left;
	        font-size: 14px;
	        padding-bottom: 6px;
	        color: rgb(241, 130, 48);
	        width: 100px;
	        vertical-align: middle;
	      }
	      td {
	        width: 80px;
	      }
	      input[type="text"], input[type="password"] {
	        width: 100%;
	        padding: 12px 18px;
	        border: 2px solid rgb(241, 130, 48);
	        border-radius: 15px;
	        font-size: 18px;
	        font-weight: 600;
	        color:rgb(241, 130, 48);
	        box-sizing: border-box;
	        transition: border-color 0.3s ease;
	      }
	      input[type="text"]:focus, input[type="password"]:focus {
	        outline: none;
	        border-color: rgb(237, 220, 103);
	        background-color: rgb(255, 254, 249);
	      }
	      input[type="submit"] {
	        display: block;
	        width: 100%;
	        margin-top: 30px;
	        padding: 15px 0;
	        background-color:rgb(241, 130, 48);
	        border: none;
	        border-radius: 25px;
	        font-size: 16px;
	        font-weight: 700;
	        color: white;
	        cursor: pointer;
	        
	        transition: background-color 0.3s ease, box-shadow 0.3s ease;
	      }
	      input[type="submit"]:hover {
	        background-color: rgb(156, 63, 12);
	        box-shadow: 0 8px 18px rgb(128, 64, 0);
			}
</style>
</head>
<body>
		
		<div class = "container">
			
		<img src="/images/ouen_jersey_woman5_yellow.png" alt="応援画像">
			<div th:unless = "${loginmessage}">
		<br>
		<a th:href="@{/weight/userForm}">目標を設定してダイエットを始める！</a>
			
		<br>
		<p text>↓ 登録済みの方はこちらから ↓</p>
	
		</div>
			<p th:if="${loginmessage}" th:text="${loginmessage}"
			style="color:orangered;">ログイン進行</p>
		<div th:if="${param.error}">
				<p style="color:red;">usernameまたはpasswordが違います</p>
				</div>
				<!--ログアウト表示-->
				<div th:if="${param.logout}">
					<p style="color:blue">ログアウトしました</p>
				</div>
				<form th:action="@{/authentication}" method ="post" th:object="${loginForm}">
					<div><!--ユーザー名-->
					<label for="usernameInput">username</label>
				<input type="text" th:field="*{usernameInput}">
			</div>
			<div><!--パスワード-->
				<label for="passwordInput">password</label>
				<input type="password" th:field="*{passwordInput}">
			</div>
			<div>
				<input type="submit" value="login">
			</div>
				</form>	
		
	<!--	<a th:href="@{/weight/form}">今日の体重を記録する</a>
		<br>
		<br>
		<a th:href="@{/weight/main}">記録を見る</a>
	-->
		</div>
</body>
</html>
