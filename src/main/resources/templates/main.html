<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>メイン画面</title>
<style>
	.main-wrapper {
	  width: 80%;
	  margin: 0 auto;
	  text-align: left;
	}
	
	table {
	  width: 80%;
	  border-collapse: separate;
	  border-spacing: 0;
	  margin: 8px auto;
	  background-color: #fff; /* 白ベースで清潔感 */
	  border-radius: 12px;
	  box-shadow: 0 4px 8px rgba(255, 192, 203, 0.4); /* ほんのりピンク影 */
	  overflow: hidden;
	  font-size: 16px;
	}

	th, td {
	  padding: 2px 5px;
	  text-align: center;
	  border-bottom: 1px solid #f5a9b8;
	}

	th {
	  background-color: #fcd5ce; /* 淡いピンク */
	  color: #d6336c;
	  font-weight: 300;
	  font-family: 'Comic Neue', 'Poppins', sans-serif;
	}

	td {
	  background-color: #fff0f6;
	}

	tr:hover td {
	  background-color: #ffe2f0; /* ホバー時の色 */
	  transition: background-color 0.3s ease;
	}

	input[type="submit"] {
	  background-color: #ffb3c1;
	  border: none;
	  padding: 6px 10px;
	  border-radius: 8px;
	  color: white;
	  font-weight: bold;
	  cursor: pointer;
	}

	input[type="submit"]:hover {
	  background-color: #f78da7;
	}

	a ,form {
	  font-size: 1rem;
	  padding: 4px 8px;
	  background-color: #ffd6e0;
	  border-radius: 8px;
	  color: #c9184a;
	  text-decoration: none;
	  margin: 4px;
	  display: inline-block;
	  transition: 0.3s;
	}

	a:hover , form:hover {
	  background-color: #ffaccd;
	  color: white;
	}
	
	
	body {		
	   background-color:	#fff0f6;	  
	   font-family: Arial, sans-serif;
	   font-family: 'Comic Neue', 'Poppins', Arial, sans-serif;
	     color: #d6336c; /* 柔らかいパープル系 */
	  
	     letter-spacing: 0.05em; /* 少し字間を開けて読みやすく */
	 }
	 /*
	 a {
	     font-size: 1.0rem;      /* 文字サイズ大きく 
	     color: white;           /* 見やすいオレンジに 
	     text-decoration: none;  /* 下線を消す 
	     font-weight: bold;
	     padding: 2px 5px;
		 background-color: rgb(255, 128, 192);
	     border: 0.5px solid rgb(128, 0, 64);
	     border-radius: 10px;
	     transition: background-color 0.3s, color 0.3s;
	 	display: inline-block;
	   }
	   
	   a:hover {
	       background-color: white;
	       color: #f72585;
	     }
		 */
		 
		 button{
		   border-radius: 12px;
		   border: 1.5px solid #f5a9b8;
		   padding: 8px 15px;
		   font-family: 'Poppins', sans-serif;
		   box-shadow: 2px 2px 5px rgba(245, 169, 184, 0.4);
		   transition: background-color 0.3s ease;
		 }
		 h1, h2, h3, p {
		   text-shadow: 1px 1px 2px rgba(255, 192, 203, 0.4); /* ほんのりピンクの影 */
		   border-radius: 5px;
		 }

	
</style>
</head>
<body>
	<div class="main-wrapper">
	<h2>記録</h2>
	<p th:if="${message}" th:text="${message}"
		style="color:blue;">完了メッセージ
		</p>
	<a th:href="@{/weight/form}">今日の体重を記録する</a>
	
	<div th:if="${goal != null and goal.goalWeight != null and leatest != null and leatest.weight != null}"
	     th:text="'目標体重(' + ${goal.goalWeight} + ' kg)まであと' + (${leatest.weight} - ${goal.goalWeight}) + 'kg!!'"
	     style="color:orangered">
	</div>
	<!--
	<div th:if="@{goal.goalWeight} and @{leatest.weight}"th:text="'目標体重(' + ${goal.goalWeight} + ' kg)まであと' + (${leatest.weight} - ${goal.goalWeight}) + 'kg!!'"
	style = "color:orangered"></div>
	<div th:if = "@{goal.GoalDay} th:text="@{/weight/pass} + '日目      残り' + (@{/weight/remain}) + '日'"
		style = "color:blue"></div>
	-->
	
		
		<a th:href="@{/weight/chart}">グラフで見る</a>
	</div>
	<table border ="1" width="500">
			<thead>
				<tr>
					<th>日付</th>
					<th>体重</th>
					<th>体脂肪率</th>
					<th>メモ</th>
					<th>削除</th>
					<th>編集</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="data:${WeightRecords}">
					<td th:text="${data.recordDay.format(
									T(java.time.format.DateTimeFormatter).
									ofPattern('yyyy/MM/dd'))}"></td>
					<td th:text="${data.weight} + ' kg'"></td>
					<td th:text="${data.fat} + ' ％'"></td>
					<td th:text="${data.memo}"></td>
					<td><form th:action="@{/weight/delete/{id}(id=${data.id})}" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type ="submit" value="削除"/></form></td>
					<td><a th:href="@{/weight/edit/{id}(id=${data.id})}">編集</a></td>
				</tr>
				</tbody>
		</table>
		<div class="main-wrapper">
		<a href="@{/}">ゴールを設定しなおす</a>
		<form th:action="@{/logout}" method="post">
				<input type="submit" value="ログアウト">
			</form>
		
		<a href="@{/}">ユーザーデータ削除</a>
	</div>
</body>
</html>
