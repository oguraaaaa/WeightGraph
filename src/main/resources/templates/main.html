<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>メイン画面</title>
<style>
	
	.link-row{
		display: flax;
		justify-content: space-between;
	}
	
	/* 吹き出し＋アイコンの親：右上に浮かせて表示 */
	.bubble-float {
	  margin-right: 8.0rem;
	  position: absolute;
	  top: 4rem;
	  right: 0;
	  display: flex;
	  align-items: center;
	  justify-content: flex-end;
	  background: url("/images/e1416_1.png") no-repeat center center / contain;
	  width: 300px;
	  height: 100px;
	  padding: 0 0.5rem 0 2rem;
	  box-sizing: border-box;
	  z-index: 10;
	}

	/* メッセージテキスト */
	.bubble-message {
	  flex: 1;
	  font-size: 1rem;
	  color: #808080;
	  white-space: nowrap;
	}

	/* アイコン画像 */
	.bubble-icon {
	  width: 60px;
	  height: 60px;
	  border-radius: 50%;
	  object-fit: cover;
	  margin-left: 0.5rem;
	}

	.main-wrapper {
	  width: 80%;
	  margin: 0 auto;
	  text-align: left;
	}
	
	table {
	  width: 80%;
	  border-collapse: separate;
	  border-spacing: 0;
	  margin: 8px auto;
	  background-color: #fff; /* 白ベースで清潔感 */
	  border-radius: 12px;
	  box-shadow: 0 4px 8px rgba(255, 192, 203, 0.4); /* ほんのりピンク影 */
	  overflow: hidden;
	  font-size: 16px;
	}

	th, td {
	  padding: 2px 5px;
	  text-align: center;
	  border-bottom: 1px solid #f5a9b8;
	}

	th {
	  background-color: #fcd5ce; /* 淡いピンク */
	  color: #d6336c;
	  font-weight: 300;
	  font-family: 'Comic Neue', 'Poppins', sans-serif;
	}

	td {
	  background-color: #fff0f6;
	}

	tr:hover td {
	  background-color: #ffe2f0; /* ホバー時の色 */
	  transition: background-color 0.3s ease;
	}

	input[type="submit"],button[type="submit"] {
	  font-size: 1rem;
	  background-color: #ffb3c1;
	  border: none;
	  padding: 4px 8px;
	  border-radius: 8px;
	  color: white;
	 
 
	}

	input[type="submit"]:hover {
	  background-color: #f78da7;
	}

	a ,form {
	  font-size: 1rem;
	  padding: 4px 8px;
	  background-color: #ffd6e0;
	  border-radius: 8px;
	  color: #c9184a;
	  text-decoration: none;
	  margin: 4px;
	  display: inline-block;
	  transition: 0.3s;
	}

	a:hover , form:hover {
	  background-color: #ffaccd;
	  color: white;
	}
	
	
	body {		
	   background-color:	#fff0f6;	  
	   font-family: Arial, sans-serif;
	   font-family: 'Comic Neue', 'Poppins', Arial, sans-serif;
	     color: #d6336c;
	  
	     letter-spacing: 0.05em; /* 少し字間を開けて読みやすく */
	 }
	
		 button{
		   border-radius: 12px;
		   border: 1.5px solid #f5a9b8;
		   padding: 8px 15px;
		   font-family: 'Poppins', sans-serif;
		   box-shadow: 2px 2px 5px rgba(245, 169, 184, 0.4);
		   transition: background-color 0.3s ease;
		 }
		 h1, h2, h3, p {
		   text-shadow: 1px 1px 2px rgba(255, 192, 203, 0.4); /* ほんのりピンクの影 */
		   border-radius: 5px;
		 }

	
</style>
</head>
<body>
	<div class="main-wrapper" position:relative;>
	<h2>記録</h2>
	<p th:if="${message}" th:text="${message}"
		style="color:orangered;">完了メッセージ
	</p>

	<div th:if="${remainday}" th:text="|${goal.goalDay}まであと${remainday}日|"></div>
	<div th:if="${bwdistance}"
	     th:text="|目標体重まであと${bwdistance}kg!!|" style="color:orangered">
	
	</div>
	
	<div class="link-row">
		<div class="left-link">
	<a th:href="@{/weight/form}">今日の体重を記録する</a>
		<a th:href="@{/weight/chart}">グラフで見る</a>
		</div>
		<div clss="right-link">			
			<div class="bubble-float">
		   	<div class="bubble-message" th:text="${User.displayName} + 'さん、こんにちは！'"></div>
		   	<img src="/images/nikukyuneko.png" alt="アイコン" class="bubble-icon"></div>
		</div>					
	</div>
	
	<!--
	<div th:if="@{goal.goalWeight} and @{leatest.weight}"th:text="'目標体重(' + ${goal.goalWeight} + ' kg)まであと' + (${leatest.weight} - ${goal.goalWeight}) + 'kg!!'"
	style = "color:orangered"></div>
	<div th:if = "@{goal.GoalDay} th:text="@{/weight/pass} + '日目      残り' + (@{/weight/remain}) + '日'"
		style = "color:blue"></div>
	-->
	</div>
		 
	<!--	
	<div class="kasaneru">
	  <div class="message" th:text="${User.displayName} + ' さん、こんにちは！'"></div>
	  <div class="icon">
	    <img src="/images/nikukyuneko.png" alt="アイコン画像">
	  </div>
	</div>
	-->
	<br>
	<table border ="1" width="500">
			<thead>
				<tr>
					<th>日付</th>
					<th>体重</th>
					<th>体脂肪率</th>
					<th>メモ</th>
					<th>編集</th>
					<th>削除</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="data:${WeightRecords}">
					<td th:text="${data.recordDay.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy/MM/dd'))}"></td>
					<td th:text="${data.weight} + ' kg'"></td>
					<td th:text="${data.fat != null ? data.fat + ' ％' : 'ー'}"></td>
					<td th:text="${data.memo}"></td>
					<td><a th:href="@{/weight/edit/{id}(id=${data.id})}">編集</a></td>
					<td><form th:action="@{/weight/delete/{id}(id=${data.id})}" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<input type ="submit" value="削除"/></form></td>
				</tr>
				</tbody>
		</table>
		<div class="main-wrapper">
		<a th:href="@{/goal/edit}">ゴールを編集</a>
		<form id = "logout" th:action="@{/logout}" method="post">
				<button type="submit">ログアウト</button>
			</form>
		
		<form id = "deleteAll" th:action="@{/weight/deleteAll}" method="post">			
		<button type="submit">全記録を削除</button></form>
		
		<form id = "deleteUser" th:action="@{/weight/deleteUser}" method="post">
		<button type="submit">ユーザデータを削除</button></form>
		
		<script>
			//リンクがあるアンカーの取得
			       const deleteform = document.getElementById('deleteAll');
			       //リンクがクリックされたときの処理
			       deleteform.addEventListener('submit', (event) => {
			           //確認ダイアログの表示
			           const isOk = confirm('削除したデータは戻せません。\n本当に削除しますか？');

			           //[キャンセル]が押されたか
			           if(!isOk){
			               //デフォルトの動作（リンクの遷移）を停止
			               event.preventDefault();
			           }
			       });
				   
				   //リンクがあるアンカーの取得
				   	 const logoutform = document.getElementById('logout');
				   	 //リンクがクリックされたときの処理
				   	logoutform.addEventListener('submit', (event) => {
				   	 //確認ダイアログの表示
				   	 const isOk = confirm('ログアウトしますか？');

				   	 //[キャンセル]が押されたか
				   	if(!isOk){
				   	 //デフォルトの動作（リンクの遷移）を停止
				   	event.preventDefault();
				   	 }
				   	});
					
					//リンクがあるアンカーの取得
   	 const userdeleteform = document.getElementById('deleteUser');
	 //リンクがクリックされたときの処理
		userdeleteform.addEventListener('submit', (event) => {
	 //確認ダイアログの表示
	    const isOk = confirm('ユーザー情報及び記録データを削除します。\n削除したデータは戻せません。\n本当に削除しますか？');
	//[キャンセル]が押されたか
		if(!isOk){
	//デフォルトの動作（リンクの遷移）を停止
		event.preventDefault();
	 }
		});					
			
		</script>
	</div>
</body>
</html>
