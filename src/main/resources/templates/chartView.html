<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>体重と体脂肪のグラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		body {
		   background-color:	white;
		   margin: 0;
		   height: 100vh; /* 画面高さいっぱい */
		   display: flex;
		   justify-content: center; /* 横方向中央寄せ */
		   align-items: center;     /* 縦方向中央寄せ */
		   font-family: Arial, sans-serif;
		 }

		 a {
		   display: block;
		   margin-top: 20px;
		   text-align: center;
		   color: #a83254;
		   font-weight: 600;
		   text-decoration: none;
		   font-size: 16px;
		   transition: color 0.3s ease;
		 }
		 a:hover {
		   color: #f72585;
		 }
	</style>
</head>
<body>	
	   <canvas id="healthChart" width="200" height="100"></canvas>

	   <script>
	       Promise.all([
	           fetch('/api/records').then(res => res.json()),
	           fetch('/api/goal').then(res => res.json()).catch(() => null) // goal取得エラーでも続行
	       ]).then(([records, goal]) => {

	           if (!records.length) {
	               alert('記録データがありません');
	               return;
	           }
			   
			   const labels = records.map(r => {
			       const date = new Date(r.recordDay);
			       return date.toLocaleDateString('ja-JP', {
			           month: 'numeric',
			           day: 'numeric'
			       }); // 例: 10/2
			   });

			   
	        //   const labels = records.map(r => new Date(r.recordDay).toLocaleDateString());
	           const weights = records.map(r => r.weight);
	           const fats = records.map(r => r.fat);

	           const datasets = [
	               {
	                   label: '体重 (kg)',
	                   data: weights,
	                   borderColor: 'blue',
	                   yAxisID: 'yWeight',
	                   tension: 0.3,
	               },
	               {
	                   label: '体脂肪率 (%)',
	                   data: fats,
	                   borderColor: 'green',
	                   yAxisID: 'yFat',
	                   tension: 0.3,
	               }
	           ];

	           // 目標ラインがある場合だけ追加
	           if (goal && goal.goalWeight != null) {
	               const goalWeightLine = new Array(labels.length).fill(goal.goalWeight);
	               datasets.push({
	                   label: '目標体重 (kg)',
	                   data: goalWeightLine,
	                   borderColor: 'blue',
	                   borderDash: [5, 5],
	                   pointRadius: 0,
	                   yAxisID: 'yWeight',
	               });
	           }

	           if (goal && goal.goalFat != null) {
	               const goalFatLine = new Array(labels.length).fill(goal.goalFat);
	               datasets.push({
	                   label: '目標体脂肪率 (%)',
	                   data: goalFatLine,
	                   borderColor: 'green',
	                   borderDash: [5, 5],
	                   pointRadius: 0,
	                   yAxisID: 'yFat',
	               });
	           }

	           const ctx = document.getElementById('healthChart').getContext('2d');
			   const minWeight = Math.min(...weights);
			   const maxWeight = Math.max(...weights);
			   const minFat = Math.min(...fats);
			   const maxFat = Math.max(...fats);
			   
	           new Chart(ctx, {
	               type: 'line',
	               data: {
	                   labels: labels,
	                   datasets: datasets
	               },
	               options: {
	                   responsive: true,
	                   scales: {
	                       yWeight: {
	                           type: 'linear',
	                           position: 'left',
	                           title: {
	                               display: true,
	                               text: '体重 (kg)',
								   font: {
								           size: 20
								                      }
	                           },
						 ticks: {
							    font: {
							          size: 16 }// 目盛りフォントサイズ
							                  },
						  // 自動調整に加えて少し余裕を持たせる               
							     min: minWeight *0.95,
							     max: maxWeight *1.05
	                       },
	                       yFat: {
	                           type: 'linear',
	                           position: 'right',
	                           title: {
	                               display: true,
	                               text: '体脂肪率 (%)',
								   font: {
										      size: 20
								                      }
	                           },
							   ticks: {
							                  font: {
							                      size: 16 // 目盛りフォントサイズ
							                  },
							              },   
	                           grid: {
	                               drawOnChartArea: false
	                           },
						 // 自動調整に加えて少し余裕を持たせる											  
				         min: (minFat * 0.95),
						 max: (maxFat * 1.05)
	                       },
	                       x: {
	                           title: {
	                               display: true,
	                               text: '日付',
								   font: {
								              size: 20
								                      }
	                           }
	                       }
	                   },
	                   plugins: {
	                       legend: {
	                           position: 'top',
							   labels: {
							                  font: {
							                      size: 16 // 凡例（ライン名）のフォントサイズ
							                  }
							              }
	                       }
	                   }
	               }
	           });

	       }).catch(err => {
	           console.error(err);
	           alert('データ取得中にエラーが発生しました。');
	       });
	   </script>
	   <br>
	   <a th:href="@{/weight/main}">戻る</a>
</body>
</html>
