<!DOCTYPE html>
<html xmlns:th ="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>記録画面</title>
<style>
	body {
	     background-color: #fff0f6; /* 薄いピンク背景 */
	     font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
	     display: flex;
	     justify-content: center;
	     padding: 40px 0;
	   }
	   form {
	     background: #ffe6f0;
	     padding: 30px 40px;
	     border-radius: 20px;
	     box-shadow: 0 8px 15px rgba(255, 182, 193, 0.4);
	     width: 400px;
	   }
	   h2 {
	     color: #d6336c;
	     text-align: center;
	     margin-bottom: 30px;
	     font-weight: bold;
	     font-size: 28px;
	   }
	   table {
	     width: 100%;
	     border-collapse: separate;
	     border-spacing: 0 18px;
	   }
	   th {
	     text-align: left;
	     font-size: 18px;
	     padding-bottom: 6px;
	     color: #a83254;
	     width: 100px;
	     vertical-align: middle;
	   }
	   td {
	     width: 120px;
	   }
	   input[type="text"], input[type="password"] {
	     width: 100%;
	     padding: 12px 18px;
	     border: 2px solid #d6336c;
	     border-radius: 15px;
	     font-size: 18px;
	     font-weight: 600;
	     color: #5a1a3f;
	     box-sizing: border-box;
	     transition: border-color 0.3s ease;
	   }
	   input[type="text"]:focus, input[type="password"]:focus {
	     outline: none;
	     border-color: #f72585;
	     background-color: #fff0f6;
	   }
	   input[type="submit"] {
	     display: block;
	     width: 100%;
	     margin-top: 30px;
	     padding: 15px 0;
	     background-color: #f72585;
	     border: none;
	     border-radius: 25px;
	     font-size: 20px;
	     font-weight: 700;
	     color: white;
	     cursor: pointer;
	     box-shadow: 0 6px 12px rgba(247, 37, 133, 0.5);
	     transition: background-color 0.3s ease, box-shadow 0.3s ease;
	   }
	   input[type="submit"]:hover {
	     background-color: #d6336c;
	     box-shadow: 0 8px 18px rgba(214, 51, 108, 0.7);
	   }
	   .error-msg {
	     display: block;
	     margin-top: 5px;
	     color: #e63946;
	     font-weight: 700;
	     font-size: 14px;
	   }
	   
	   a {
	     display: block;
	     margin-top: 20px;
	     text-align: center;
	     color: #a83254;
	     font-weight: 600;
	     text-decoration: none;
	     font-size: 16px;
	     transition: color 0.3s ease;
	   }
	   a:hover {
	     color: #f72585;
	   }
</style>	
</head>
<body>
		<p th:if="${message}" th:text="${message}"
			style="color:blue;">初回案内メッセージ
			</p>
	<!--タイトル：登録 or 編集-->
		<h2 th:if="${recordWeightForm.isNew}">今日の記録</h2>
		<h2 th:unless="${recordWeightForm.isNew}">記録の編集</h2>
		<!--アクション：登録 or 編集-->
		<form th:action="${recordWeightForm.isNew}?@{/weight/save}:@{/weight/update}"
			th:object="${recordWeightForm}" method="post">
		<input type="hidden" th:field="*{id}">
		<table>
			<tr>
				<th>日付</th>
					<td>
					<input type="date" th:field="*{recordDay}">
					<!--日付用：バリデーションエラー表示-->
					<span th:if="${#fields.hasErrors('recordDay')}"
					th:errors="*{recordDay}" class="error-msg">
						エラーがあれば表示
					</span>			
					</td>
				</tr>								
			
				<tr>
					<th>体重</th>
					<td>
						<input type="text" th:field="*{weight}">
						<!--体重用：バリデーションエラー表示-->
					<span th:if="${#fields.hasErrors('weight')}"
						th:errors="*{weight}" class="error-msg">
					エラーがあれば表示
				</span>				
					</td>
				</tr>
				<tr>
					<th>体脂肪率</th>
					<td>
						<input type="text" th:field="*{fat}">
						<!--体脂肪用：バリデーションエラー表示-->
						<span th:if="${#fields.hasErrors('fat')}"
							th:errors="*{fat}" class="error-msg">
						エラーがあれば表示
						</span>			
					</td>
				</tr>						
				<tr>					
					<th>メモ</th>
				<td>
					<textarea rows="3" cols="30" th:field="*{memo}">						
					</textarea>
					<!--詳細用：バリデーションエラー表示-->
						<span th:if="${#fields.hasErrors('memo')}"
					th:errors="*{memo}" class="error-msg">
					エラーがあれば表示
					</span>				
				</td>
				</tr>
			</table>
				<!--ボタン：登録　or　編集-->
				<input th:if="${recordWeightForm.isNew}" type="submit" value="登録">			
				<input th:unless="${recordWeightForm.isNew}" type="submit" value="更新">
			</form>
			<a th:href="@{/weight/main}">戻る</a>
			<!--<a th:href="@{/weight/noset}">記録せずに進む</a>		
		-->
		
</body>
</html>
