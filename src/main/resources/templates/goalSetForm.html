<!DOCTYPE html>
<html xmlns:th ="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>目標設定画面</title>
</head>
<body>
	<!--タイトル：登録 or 編集-->
	<h2 th:if="${goalSetForm.isNew}">目標を設定</h2>
	<h2 th:unless="${goalSetForm.isNew}">目標の編集</h2>
	<!--アクション：登録 or 編集-->
		<form th:action="${goalSetForm.isNew}?@{/weight/goal/save}:@{/weight/goal/update}"
			th:object="${goalSetForm}" method="post">
		
		<table>
			<tr>
				<th>目標体重</th>
				<td>
					<input type="text" th:field="*{goalWeight}">
					<!--体重用：バリデーションエラー表示-->
				<span th:if="${#fields.hasErrors('goalWeight')}"
					th:errors="*{goalWeight}" style="color:red">
					エラーがあれば表示
				</span>				
				</td>
				</tr>
			<tr>
				<th>目標体脂肪率</th>
				<td>
					<input type="text" th:field="*{goalFat}">
					<!--体脂肪用：バリデーションエラー表示-->
					<span th:if="${#fields.hasErrors('goalFat')}"
						th:errors="*{goalFat}" style="color:red">
					エラーがあれば表示
					</span>			
				</td>
				</tr>						
				<tr>					
			<th>★やりたいこと★</th>
				<td>
					<textarea rows="3" cols="30" th:field="*{memo}">						
					</textarea>
				<th>・〇〇のワンピースで同窓会に行く！<br>・プールで可愛い水着を着る！・・等</th>	
				<!--詳細用：バリデーションエラー表示-->			
					<span th:if="${#fields.hasErrors('memo')}"
					th:errors="*{memo}" style="color:red;">
				エラーがあれば表示
					</span>				
				</td>
				</tr>
			<tr>
				<th>いつまでに？</th>
				<td>
					<input type="date" th:field="*{goalDay}">
				<!--日付用：バリデーションエラー表示-->
					<span th:if="${#fields.hasErrors('goalDay')}"
					th:errors="*{goalDay}" style="color:red">
						エラーがあれば表示
					</span>			
				</td>
				</tr>															
				
				
				</table>
					<!--ボタン：登録　or　編集-->
					<input th:if="${goalSetForm.isNew}" type="submit" value="登録！">			
					<input th:unless="${goalSetForm.isNew}" type="submit" value="更新～★">
				</form>
	<!--			<a th:href="@{/weight}">戻る</a>		
				<a th:href="@{/weight/main}">記録を見る</a>		
			-->
</body>
</html>
